name: LoyaltyCardsApp
options:
  bundleIdPrefix: com.otterpia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
targets:
  LoyaltyCardsApp:
    type: application
    platform: iOS
    sources:
      - Sources/LoyaltyCardsApp
    info:
      path: Sources/LoyaltyCardsApp/Info.plist
      properties:
        CFBundleDisplayName: Cardless
        CardlessBrandPresetURL: ""
        NSCameraUsageDescription: Cardless uses the camera to scan loyalty card barcodes.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.cardless
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LoyaltyCardsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LoyaltyCardsAppTests
    dependencies:
      - target: LoyaltyCardsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.cardless.tests
        GENERATE_INFOPLIST_FILE: YES
  LoyaltyCardsAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/LoyaltyCardsAppUITests
    dependencies:
      - target: LoyaltyCardsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.cardless.uitests
        GENERATE_INFOPLIST_FILE: YES
